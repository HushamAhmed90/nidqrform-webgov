<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>تم إيقاف البرنامج</title>
  <style>
    html, body { margin: 0; height: 100%; background: #EDF1EF; color: #16211D;
      font-family: Tahoma, 'Segoe UI', Arial, sans-serif; }
    main { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; }
    .box { max-width: 420px; background: #fff; border-radius: 16px; padding: 28px 22px; text-align: center; line-height: 1.9; }
    h1 { font-size: 21px; margin: 0 0 10px; }
    p { margin: 0 0 8px; font-size: 16px; color: #5B6B65; }
  </style>
</head>
<body>
  <main>
    <div class="box">
      <h1>تم إيقاف هذا البرنامج</h1>
      <p>شكراً لكل من استخدمه.</p>
      <p>إذا كان البرنامج مثبتاً على موبايلك، يمكنك حذف أيقونته.</p>
      <hr style="border:0;border-top:1px solid #E1E7E4;margin:16px 0">
      <p dir="rtl">ئەم بەرنامەیە ڕاگیراوە. سوپاس بۆ هەموو ئەوانەی بەکاریان هێنا.</p>
    </div>
  </main>
  <script>
    // Remove everything the app stored on this device: offline copy and saved form draft.
    try { localStorage.clear(); sessionStorage.clear(); } catch (e) {}
    if ('caches' in window) {
      caches.keys().then(function (keys) { keys.forEach(function (k) { caches.delete(k); }); });
    }
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (r) { r.unregister(); });
      });
    }
  </script>
</body>
</html>
